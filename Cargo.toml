[package]
name = "fast-dictate-backend"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Low-latency private dictation for Apple Silicon: Cohere Transcribe MLX + S1-mini."
repository = "https://github.com/tristan-mcinnis/local-dictation"
readme = "README.md"
keywords = ["dictation", "speech-to-text", "cohere", "mlx", "macos"]
categories = ["multimedia::audio", "command-line-utilities"]

[lib]
name = "fast_dictate_backend"
path = "src/lib.rs"

[[bin]]
name = "fast-dictate-backend"
path = "src/main.rs"

[features]
default = []
cohere-mlx = ["dep:base64", "dep:hound"]
# Adds llama.cpp (via llama-cpp-2) with Metal for the cleanup engine.
# llama-cpp-2 (despite its 0.1.x version) is the actively-maintained binding;
# `llama_cpp` 0.3.x vendors a llama.cpp from April 2024 and cannot load Gemma 3.
cleaner = ["dep:llama-cpp-2", "dep:encoding_rs"]
# Real macOS Accessibility-based text injection + clipboard fallback +
# menu-bar status item + floating cursor pill.
ax-inject = [
    "dep:accessibility-sys",
    "dep:core-foundation",
    "dep:core-graphics",
    "dep:arboard",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-core-foundation",
    "dep:block2",
]
# The one-user production stack: Cohere MLX + S1-mini + native Mac UI/output.
full = ["cohere-mlx", "cleaner", "ax-inject"]

[dependencies]
ringbuf = "0.4"
cpal = "0.15"
eyre = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lightweight on-device dictation history store. `bundled` compiles SQLite
# from source so we don't depend on the system libsqlite3 version.
rusqlite = { version = "0.39", features = ["bundled"] }
base64 = { version = "0.22", optional = true }
hound = { version = "3.5", optional = true }
llama-cpp-2 = { version = "0.1", optional = true, default-features = false, features = ["metal"] }
encoding_rs = { version = "0.8", optional = true }
accessibility-sys = { version = "0.2", optional = true }
core-foundation = { version = "0.10", optional = true }
core-graphics = { version = "0.25", optional = true }
arboard = { version = "3", optional = true, default-features = false }
libc = "0.2"
# Menu-bar status item. Pulled in only with the ax-inject feature (the daemon
# path) — the lib build doesn't need it.
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString", "NSArray", "NSData", "NSRunLoop", "NSThread", "NSDate", "NSDateFormatter", "NSAttributedString", "NSDictionary", "NSValue", "NSGeometry", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSApplication",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSMenu",
    "NSMenuItem",
    "NSButton",
    "NSResponder",
    "NSControl",
    "NSView",
    "NSCell",
    "NSWindow",
    "NSColor",
    "NSScreen",
    "NSTextField",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageView",
    # Plain native "Dictation History" window: a read-only NSTextView in a
    # scroll view. No WebView / HTML.
    "NSText",
    "NSTextView",
    "NSScrollView",
    "NSFont",
    # Read the general pasteboard's changeCount so the clipboard-paste fallback
    # doesn't clobber something the user copied during the paste-settle window.
    "NSPasteboard",
    # Snapshot/restore every flavour of every pasteboard item around a
    # clipboard paste, and mark our own write transient (nspasteboard.org).
    "NSPasteboardItem",
    # Detect the frontmost app (bundle id) so audio-ducking can skip muting
    # system output while a call app is in front — see audio_duck.rs.
    "NSWorkspace",
    "NSRunningApplication",
    # Native Settings window controls: popups for pickers, switches for toggles.
    "NSPopUpButton",
    "NSSwitch",
    # ── House design (Slate) ────────────────────────────────────────────
    # Appearance-aware dynamic colours (NSColor colorWithName:dynamicProvider:),
    # the glass material behind the pill / panels, vector drawing for the
    # Slate primitives, and the bitmap path the offscreen `render-ui`
    # subcommand uses to snapshot every window without showing it.
    "NSAppearance",
    "NSColorList",
    "block2",
    "NSVisualEffectView",
    "NSSearchField",
    "NSBezierPath",
    "NSShadow",
    "NSAttributedString",
    "NSParagraphStyle",
    "NSStringDrawing",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSTrackingArea",
    "NSClipView",
] }
block2 = { version = "0.6", optional = true }
objc2-core-foundation = { version = "0.3", optional = true, features = ["CFRunLoop", "CFBase", "CFString", "CFDate"] }

[dev-dependencies]
