name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (featureless, no models or native deps)
        run: cargo test
      - name: Scrub
        run: sh tests/scrub.sh
      - name: Build all targets with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --all-targets
